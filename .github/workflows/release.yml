name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Prepare bundled Python
        run: python scripts/prepare_runtime.py --target ${{ matrix.target }}
      - name: Engine tests
        working-directory: engine
        run: ../build/runtime/${{ matrix.target }}/python/bin/python3 -m unittest discover -s tests -v
      - name: Go tests
        run: go test ./internal/...
      - name: Package
        run: wails3 package
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      - name: Zip app
        run: ditto -c -k --keepParent "bin/shuake-all-in-one.app" "bin/shuake-all-in-one-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: shuake-all-in-one-${{ matrix.target }}
          path: bin/*.zip
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: shuake-all-in-one-*
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
