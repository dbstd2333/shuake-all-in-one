name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-amd64
          - os: windows-latest
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y
      - name: Prepare bundled Python
        run: python scripts/prepare_runtime.py --target ${{ matrix.target }}
      - name: Engine tests
        shell: bash
        run: |
          PY=build/runtime/${{ matrix.target }}/python/bin/python3
          [ -f "$PY" ] || PY=build/runtime/${{ matrix.target }}/python/python.exe
          cd engine && "../$PY" -m unittest discover -s tests -v
      - name: Go tests
        run: go test ./internal/...
      - name: Package
        shell: bash
        run: wails3 package
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "bin/shuake-all-in-one.app" "bin/shuake-all-in-one-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: shuake-all-in-one-${{ matrix.target }}
          path: |
            bin/*.zip
            bin/*-installer.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.zip
            bin/*-installer.exe
